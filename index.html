<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>운동 세트 체크리스트</title>
<meta name="theme-color" content="#14161a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="운동체크" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #14161a; }
  body {
    color: #f5f5f0;
    font-family: 'Inter', -apple-system, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
  }
  button { font-family: inherit; cursor: pointer; }
  input[type=number]::-webkit-inner-spin-button { opacity: 1; }
  input, button { -webkit-appearance: none; appearance: none; }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .eyebrow { font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 2px; color: #f2542d; font-weight: 700; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; margin: 2px 0 0; }
  .ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .ring { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .ring-inner { width: 44px; height: 44px; border-radius: 50%; background: #14161a; display: flex; align-items: baseline; justify-content: center; gap: 1px; }
  .ring-num { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; }
  .ring-pct { font-size: 10px; color: #8b8f98; }
  .muted { font-size: 11px; color: #8b8f98; }
  .error-banner { background: rgba(242,84,45,0.12); border: 1px solid #f2542d; color: #ffb199; font-size: 12px; padding: 8px 12px; border-radius: 8px; margin-bottom: 14px; }
  .rest-note { background: #1e2128; border: 1px dashed #3a3f4a; color: #8b8f98; font-size: 12.5px; padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; text-align: center; }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .card { background: #1e2128; border: 1px solid #2a2e37; border-radius: 14px; padding: 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .card-title-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .edit-name-input { background: #14161a; border: 1px solid #f2542d; border-radius: 6px; color: #f5f5f0; font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; padding: 3px 8px; flex: 1; min-width: 0; }
  .card-head-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .pct-badge { font-size: 12px; font-weight: 600; font-family: 'Space Grotesk', sans-serif; min-width: 30px; text-align: right; }
  .icon-btn { background: transparent; border: none; color: #8b8f98; padding: 4px; display: flex; align-items: center; }
  .info-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .info-field { flex: 1; min-width: 0; }
  .info-label { font-size: 10px; color: #5c616c; letter-spacing: 0.5px; display: block; margin-bottom: 3px; }
  .weight-input { width: 100%; background: #14161a; border: 1px solid #2a2e37; border-radius: 7px; color: #f2542d; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; padding: 6px 10px; }
  .reps-input { width: 100%; background: #14161a; border: 1px solid #2a2e37; border-radius: 7px; color: #f5f5f0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; padding: 6px 10px; text-align: center; }
  .tap-row { display: flex; align-items: center; gap: 14px; }
  .tap-btn-small { flex: 0 0 56px; width: 56px; height: 56px; border-radius: 14px; border: 1px solid #3a3f4a; background: rgba(242,84,45,0.10); display: flex; align-items: center; justify-content: center; }
  .set-gauge-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .set-gauge { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.2s ease; }
  .set-gauge-inner { width: 48px; height: 48px; border-radius: 50%; background: #1e2128; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .set-gauge-pct { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; line-height: 1; }
  .set-gauge-count { font-size: 9px; color: #8b8f98; margin-top: 1px; }
  .target-edit-row { display: flex; align-items: center; gap: 4px; }
  .target-edit-row span { font-size: 9px; color: #5c616c; }
  .target-sets-input { width: 34px; background: transparent; border: none; border-bottom: 1px dashed #3a3f4a; color: #a8adb8; font-size: 11px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; text-align: center; padding: 1px; }
  .add-exercise-btn { width: 100%; margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; background: #f2542d; color: #14161a; border: none; border-radius: 10px; padding: 12px; font-weight: 700; font-size: 14px; font-family: 'Space Grotesk', sans-serif; }
  .add-card { margin-top: 16px; display: flex; gap: 8px; align-items: center; }
  .add-input { flex: 1; background: #1e2128; border: 1px solid #2a2e37; border-radius: 9px; color: #f5f5f0; padding: 10px 12px; font-size: 13px; min-width: 0; }
  .add-confirm-btn { background: #f2542d; color: #14161a; border: none; border-radius: 9px; padding: 10px 14px; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .foot-note { text-align: center; font-size: 11px; color: #5c616c; margin-top: 20px; }
  svg { display: block; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const SVG = {
  dumbbell: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f2542d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/></svg>`,
  plus: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>`,
  trash: `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  reset: `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`,
  pencil: `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>`,
  check: `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
  x: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`,
  repeat: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f2542d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>`,
  repeatDone: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>`,
};

const uid = () => Math.random().toString(36).slice(2, 9);

const dayLabels = ["일", "월", "화", "수", "목", "금", "토"];

const todayKey = () => {
  const d = new Date();
  return `log:${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const todayLabel = () => {
  const d = new Date();
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${dayLabels[d.getDay()]})`;
};
const todayDayName = () => dayLabels[new Date().getDay()];

// 요일별 기본 프로그램: [운동명, 중량, 목표 횟수(1세트당), 목표 세트 수]
const RAW_TEMPLATES = {
  "월": [
    ["벤치프레스", "60kg", 8, 5],
    ["인클라인 덤벨프레스", "20kg", 10, 4],
    ["케이블 크로스오버", "15kg", 12, 3],
    ["딥스", "맨몸", 10, 3],
    ["트라이셉스 푸시다운", "60kg", 12, 3],
  ],
  "화": [
    ["데드리프트", "100kg", 6, 4],
    ["랫풀다운", "40kg", 10, 4],
    ["시티드 로우", "70kg", 12, 4],
    ["바벨컬", "35kg", 10, 3],
    ["해머컬", "30kg", 12, 3],
  ],
  "수": [
    ["백스쿼트", "80kg", 8, 5],
    ["레그프레스", "160kg", 10, 4],
    ["불가리안 스플릿 스쿼트", "30kg", 10, 3],
    ["레그익스텐션", "47.5kg", 12, 3],
  ],
  "목": [
    ["오버헤드프레스", "40kg", 8, 5],
    ["사이드 레터럴 레이즈", "10kg", 12, 3],
    ["페이스풀", "30kg", 12, 3],
    ["바벨 슈러그", "60kg", 10, 3],
    ["행잉레그레이즈", "맨몸", 12, 3],
  ],
  "금": [
    ["루마니안 데드리프트", "80kg", 10, 4],
    ["레그컬", "35kg", 12, 3],
    ["워킹런지", "맨몸", 12, 3],
  ],
  "토": [],
  "일": [],
};

function buildTemplate(dayName) {
  const rows = RAW_TEMPLATES[dayName] || [];
  return rows.map(([name, weight, reps, targetSets]) => ({
    id: uid(),
    name,
    weight,
    reps,
    targetSets,
    doneSets: 0,
  }));
}

function pct(ex) {
  const target = Number(ex.targetSets || 0);
  if (target === 0) return 0;
  return Math.round((Math.min(ex.doneSets, target) / target) * 100);
}

let exercises = [];
let error = null;
let addingExercise = false;
let newName = "";
let editingId = null;
let editValue = "";

function purgeOldLogs() {
  try {
    const keep = todayKey();
    const toRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("log:") && k !== keep) toRemove.push(k);
    }
    toRemove.forEach((k) => localStorage.removeItem(k));
  } catch (e) {
    // 삭제 실패는 무시하고 계속 진행
  }
}

function load() {
  purgeOldLogs();
  try {
    const raw = localStorage.getItem(todayKey());
    if (raw) { exercises = JSON.parse(raw); return; }
    exercises = buildTemplate(todayDayName());
  } catch (e) {
    error = "불러오기에 실패했어요. 새로 시작합니다.";
    exercises = buildTemplate(todayDayName());
  }
}

function persist() {
  try {
    localStorage.setItem(todayKey(), JSON.stringify(exercises));
  } catch (e) {
    error = "저장에 실패했어요. 변경사항이 유지되지 않을 수 있어요.";
  }
}

function update() { persist(); render(); }

function tapExercise(exId) {
  const ex = exercises.find((e) => e.id === exId);
  const cap = ex.targetSets > 0 ? ex.targetSets : 999;
  ex.doneSets = ex.doneSets >= cap ? 0 : ex.doneSets + 1;
  update();
}
function setTargetSets(exId, val) {
  const v = Math.max(0, Math.min(30, Number(val) || 0));
  exercises.find((e) => e.id === exId).targetSets = v;
  update();
}
function setReps(exId, val) {
  const v = Math.max(0, Math.min(99, Number(val) || 0));
  exercises.find((e) => e.id === exId).reps = v;
  update();
}
function setWeight(exId, val) {
  exercises.find((e) => e.id === exId).weight = val;
  update();
}
function removeExercise(exId) {
  exercises = exercises.filter((e) => e.id !== exId);
  update();
}
function resetExercise(exId) {
  exercises.find((e) => e.id === exId).doneSets = 0;
  update();
}
function startEdit(exId) {
  editingId = exId;
  editValue = exercises.find((e) => e.id === exId).name;
  render();
}
function confirmEdit(exId) {
  const name = editValue.trim();
  if (name) exercises.find((e) => e.id === exId).name = name;
  editingId = null;
  editValue = "";
  update();
}
function addExercise() {
  const name = newName.trim();
  if (!name) return;
  exercises.push({ id: uid(), name, weight: "", reps: 10, targetSets: 3, doneSets: 0 });
  newName = "";
  addingExercise = false;
  update();
}

function render() {
  const app = document.getElementById("app");
  const totalPct = exercises.length ? Math.round(exercises.reduce((a, ex) => a + pct(ex), 0) / exercises.length) : 0;

  let html = `
    <div class="header">
      <div>
        <div class="eyebrow">WORKOUT LOG · ${todayDayName()}요일 프로그램</div>
        <h1>${todayLabel()}</h1>
      </div>
      <div class="ring-wrap">
        <div class="ring" style="background: conic-gradient(#f2542d ${totalPct * 3.6}deg, #2a2e37 0deg)">
          <div class="ring-inner">
            <span class="ring-num">${totalPct}</span><span class="ring-pct">%</span>
          </div>
        </div>
        <span class="muted">오늘 완수율</span>
      </div>
    </div>
    ${error ? `<div class="error-banner">${error}</div>` : ""}
    ${exercises.length === 0 ? `<div class="rest-note">오늘은 지정된 프로그램이 없어요. 아래에서 직접 운동을 추가해보세요.</div>` : ""}
    <div class="list">
  `;

  exercises.forEach((ex) => {
    const p = pct(ex);
    const reached = ex.targetSets > 0 && ex.doneSets >= ex.targetSets;
    const fillW = ex.targetSets > 0 ? Math.min(100, (ex.doneSets / ex.targetSets) * 100) : 0;

    html += `<div class="card">
      <div class="card-head">
        <div class="card-title-wrap">
          ${SVG.dumbbell}
          ${editingId === ex.id
            ? `<input class="edit-name-input" id="edit-input-${ex.id}" value="${escapeHtml(editValue)}" />`
            : `<span class="card-title">${escapeHtml(ex.name)}</span>`}
        </div>
        <div class="card-head-right">
          ${editingId === ex.id
            ? `<button class="icon-btn" data-action="confirmEdit" data-id="${ex.id}">${SVG.check}</button>`
            : `
              <span class="pct-badge" style="color:${p >= 100 ? "#2dd4bf" : "#a8adb8"}">${p}%</span>
              <button class="icon-btn" data-action="startEdit" data-id="${ex.id}">${SVG.pencil}</button>
              <button class="icon-btn" data-action="resetExercise" data-id="${ex.id}">${SVG.reset}</button>
              <button class="icon-btn" data-action="removeExercise" data-id="${ex.id}">${SVG.trash}</button>
            `}
        </div>
      </div>

      <div class="info-row">
        <div class="info-field">
          <span class="info-label">중량</span>
          <input class="weight-input" data-action="setWeight" data-id="${ex.id}" value="${escapeHtml(ex.weight ?? "")}" placeholder="예: 60kg / 맨몸" />
        </div>
        <div class="info-field" style="flex: 0 0 78px;">
          <span class="info-label">목표 횟수</span>
          <input class="reps-input" type="number" data-action="setReps" data-id="${ex.id}" value="${ex.reps}" />
        </div>
      </div>

      <div class="tap-row">
        <button class="tap-btn-small" data-action="tapExercise" data-id="${ex.id}"
          style="background:${reached ? "rgba(45,212,191,0.14)" : "rgba(242,84,45,0.10)"}; border-color:${reached ? "#2dd4bf" : "#3a3f4a"}">
          ${reached ? SVG.repeatDone : SVG.repeat}
        </button>
        <div class="set-gauge-col">
          <div class="set-gauge" style="background: conic-gradient(${reached ? "#2dd4bf" : "#f2542d"} ${p * 3.6}deg, #2a2e37 0deg)">
            <div class="set-gauge-inner">
              <span class="set-gauge-pct" style="color:${reached ? "#2dd4bf" : "#f5f5f0"}">${p}%</span>
              <span class="set-gauge-count">${ex.doneSets}/${ex.targetSets}세트</span>
            </div>
          </div>
          <div class="target-edit-row">
            <span>목표</span>
            <input class="target-sets-input" type="number" data-action="setTargetSets" data-id="${ex.id}" value="${ex.targetSets}" />
            <span>세트</span>
          </div>
        </div>
      </div>
    </div>`;
  });

  html += `</div>`;

  if (addingExercise) {
    html += `<div class="add-card">
      <input class="add-input" id="new-exercise-input" placeholder="운동 이름 (예: 데드리프트)" value="${escapeHtml(newName)}" />
      <button class="add-confirm-btn" data-action="addExercise">추가</button>
      <button class="icon-btn" data-action="cancelAdd">${SVG.x}</button>
    </div>`;
  } else {
    html += `<button class="add-exercise-btn" data-action="startAdd">${SVG.plus} 운동 추가</button>`;
  }

  html += `<p class="foot-note">요일에 맞는 기본 프로그램이 자동으로 표시되고, 기록은 이 기기에 오늘 날짜 기준으로만 저장됩니다.</p>`;

  app.innerHTML = html;

  if (editingId) {
    const input = document.getElementById(`edit-input-${editingId}`);
    if (input) {
      input.focus();
      input.selectionStart = input.selectionEnd = input.value.length;
      input.addEventListener("input", (e) => { editValue = e.target.value; });
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") confirmEdit(editingId); });
    }
  }
  if (addingExercise) {
    const input = document.getElementById("new-exercise-input");
    if (input) {
      input.focus();
      input.addEventListener("input", (e) => { newName = e.target.value; });
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") addExercise(); });
    }
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  switch (action) {
    case "tapExercise": tapExercise(id); break;
    case "removeExercise": removeExercise(id); break;
    case "resetExercise": resetExercise(id); break;
    case "startEdit": startEdit(id); break;
    case "confirmEdit": confirmEdit(id); break;
    case "startAdd": addingExercise = true; render(); break;
    case "cancelAdd": addingExercise = false; newName = ""; render(); break;
    case "addExercise": addExercise(); break;
  }
});

document.addEventListener("change", (e) => {
  if (e.target.dataset.action === "setTargetSets") {
    setTargetSets(e.target.dataset.id, e.target.value);
  }
  if (e.target.dataset.action === "setReps") {
    setReps(e.target.dataset.id, e.target.value);
  }
  if (e.target.dataset.action === "setWeight") {
    setWeight(e.target.dataset.id, e.target.value);
  }
});

load();
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
